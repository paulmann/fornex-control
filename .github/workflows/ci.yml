name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, openssl, pdo, pdo_sqlite
          coverage: none

      - name: Lint PHP and code-file encoding
        run: php tools/lint.php

      - name: Test suite (zone planning rules)
        run: php tests/plan_test.php

      - name: Secret scan
        run: php tools/secret-scan.php

      - name: Encoding of every text file
        run: php tools/lint.php --text

      - name: Boot smoke test (CLI without a config file)
        env:
          FORNEX_API_KEY: ci-dummy-value
          FORNEX_ENV: ''
          DB_PATH: var/ci.sqlite
          LOG_PATH: var/log/ci.log
          SNAPSHOT_DIR: var/snapshots
        run: |
          php backend/bin/fornex help > /dev/null
          test -f var/ci.sqlite
